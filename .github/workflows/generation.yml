name: Generation regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      azure_dev_repository:
        description: Repository containing the extension revision to test
        required: false
        default: weidongxu-microsoft/azure-dev
      azure_dev_ref:
        description: Branch, tag, or commit containing the extension revision
        required: false
        default: 88628659540297534be2c08a0bd6bd7ee75adceb

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scenarios
        uses: actions/checkout@v4

      - name: Check out azure-dev
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.azure_dev_repository || 'weidongxu-microsoft/azure-dev' }}
          ref: ${{ inputs.azure_dev_ref || '88628659540297534be2c08a0bd6bd7ee75adceb' }}
          path: azure-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: azure-dev/cli/azd/go.mod
          cache-dependency-path: azure-dev/cli/azd/extensions/azure.springboot/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: scenarios/postgresql-managed-identity/app/pom.xml

      - name: Set up azd
        uses: Azure/setup-azd@v2

      - name: Install extension developer kit
        run: azd extension install microsoft.azd.extensions --force

      - name: Build Spring extension
        run: azd x build --cwd azure-dev/cli/azd/extensions/azure.springboot

      - name: Package Spring extension
        run: >-
          azd x pack
          --cwd azure-dev/cli/azd/extensions/azure.springboot
          --bundle
          --output ./bin/bundle

      - name: Install Spring extension
        run: >-
          azd extension install
          azure-dev/cli/azd/extensions/azure.springboot/bin/bundle/azure-springboot_0.0.1.zip
          --force

      - name: Verify generated output
        shell: pwsh
        run: ./scripts/Invoke-AllScenarios.ps1
