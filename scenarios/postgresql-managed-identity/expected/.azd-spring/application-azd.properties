# Deployment-only overrides; application source is unchanged.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}?authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin&azure.managedIdentityEnabled=true&sslmode=verify-full&sslrootcert=%2Fetc%2Fssl%2Fcerts%2Fca-certificates.crt
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
